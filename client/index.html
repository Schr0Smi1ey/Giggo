<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Giggo is a Bangladesh-first freelance marketplace for structured hiring and project collaboration." />
    <title>Giggo - Freelance Marketplace</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('giggo-theme') || 'system';
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const resolved = saved === 'system' ? (prefersDark ? 'dark' : 'light') : saved;
          document.documentElement.classList.toggle('dark', resolved === 'dark');
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themePreference = saved;
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
