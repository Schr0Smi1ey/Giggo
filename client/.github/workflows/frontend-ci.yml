name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: frontend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The repository uses pwsh locally because its Windows path contains '&'.
      # CI uses a normal Linux path, so override the repository-level script shell.
      npm_config_script_shell: /bin/bash
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reject high or critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Lint when a lint script is available
        run: npm run lint --if-present

      - name: Test when a test script is available
        run: npm run test --if-present

      - name: Build production bundle
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: giggo-frontend-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
